# OpenClash / Mihomo multi-subscription template
# Replace subscription placeholders only in a local copy.
# Do not commit real subscription URLs.

mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - Mijia Cloud
    - +.push.apple.com

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost.ptlogin2.qq.com
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query

proxy-providers:
  airport_a:
    type: http
    url: "SUBSCRIPTION_URL_A"
    path: ./providers/airport_a.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
  airport_b:
    type: http
    url: "SUBSCRIPTION_URL_B"
    path: ./providers/airport_b.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
  airport_c:
    type: http
    url: "SUBSCRIPTION_URL_C"
    path: ./providers/airport_c.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  # 主入口：选择自动、手动或测速最快
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 自动最快
      - DIRECT

  # 自动容错：优先使用列表中第一个可用节点，失效时自动切换
  - name: 自动选择
    type: fallback
    use: [airport_a, airport_b, airport_c]
    url: https://www.gstatic.com/generate_204
    interval: 300

  # 手动模式：展示全部机场的全部节点
  - name: 手动选择
    type: select
    use: [airport_a, airport_b, airport_c]

  # 最快模式：周期测速并选择当前延迟最低的节点
  - name: 自动最快
    type: url-test
    use: [airport_a, airport_b, airport_c]
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: AI服务
    type: select
    proxies: [节点选择, 自动最快, 手动选择]

  - name: 电报消息
    type: select
    proxies: [节点选择, 自动最快, 手动选择]

  - name: 油管视频
    type: select
    proxies: [节点选择, 自动最快, 手动选择]

  - name: 奈飞视频
    type: select
    proxies: [节点选择, 自动最快, 手动选择]

  - name: GitHub
    type: select
    proxies: [节点选择, 自动最快, 手动选择, DIRECT]

  - name: 微软服务
    type: select
    proxies: [DIRECT, 节点选择, 自动最快, 手动选择]

  - name: 苹果服务
    type: select
    proxies: [DIRECT, 节点选择, 自动最快, 手动选择]

  # 供你以后追加需要走代理的域名/IP规则
  - name: 杂项
    type: select
    proxies: [节点选择, 自动最快, 手动选择, DIRECT]

  - name: 漏网之鱼
    type: select
    proxies: [节点选择, 自动最快, 手动选择, DIRECT]

rule-providers:
  private:
    type: http
    behavior: domain
    format: mrs
    path: ./rules/private.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs
    interval: 86400
  ads:
    type: http
    behavior: domain
    format: mrs
    path: ./rules/ads.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs
    interval: 86400
  cn:
    type: http
    behavior: domain
    format: mrs
    path: ./rules/cn.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
    interval: 86400
  cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    path: ./rules/cn-ip.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
    interval: 86400
  proxy:
    type: http
    behavior: domain
    format: mrs
    path: ./rules/proxy.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/proxy.mrs
    interval: 86400
  openai:
    type: http
    behavior: domain
    format: mrs
    path: ./rules/openai.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/openai.mrs
    interval: 86400
  telegram:
    type: http
    behavior: domain
    format: mrs
    path: ./rules/telegram.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs
    interval: 86400
  youtube:
    type: http
    behavior: domain
    format: mrs
    path: ./rules/youtube.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs
    interval: 86400
  netflix:
    type: http
    behavior: domain
    format: mrs
    path: ./rules/netflix.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs
    interval: 86400
  github:
    type: http
    behavior: domain
    format: mrs
    path: ./rules/github.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs
    interval: 86400
  microsoft:
    type: http
    behavior: domain
    format: mrs
    path: ./rules/microsoft.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs
    interval: 86400
  apple:
    type: http
    behavior: domain
    format: mrs
    path: ./rules/apple.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs
    interval: 86400

  # 自定义杂项规则：把 example.invalid 替换掉，或继续追加 payload
  misc:
    type: inline
    behavior: classical
    payload:
      - DOMAIN-SUFFIX,example.invalid

rules:
  - RULE-SET,private,DIRECT
  - RULE-SET,ads,REJECT
  - RULE-SET,misc,杂项
  - RULE-SET,openai,AI服务
  - RULE-SET,telegram,电报消息
  - RULE-SET,youtube,油管视频
  - RULE-SET,netflix,奈飞视频
  - RULE-SET,github,GitHub
  - RULE-SET,microsoft,微软服务
  - RULE-SET,apple,苹果服务
  - RULE-SET,cn,DIRECT
  - RULE-SET,cn-ip,DIRECT,no-resolve
  - RULE-SET,proxy,节点选择
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,漏网之鱼
